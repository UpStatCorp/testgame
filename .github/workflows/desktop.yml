name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['claude/cool-ptolemy-e4x1nj', 'main']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            files: |
              release/*.exe
          - os: ubuntu-latest
            script: dist:linux
            files: |
              release/*.AppImage
          - os: macos-latest
            script: dist:mac
            files: |
              release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: northern-woods-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
